name: Deploy to Production (Simple)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy Backend and Frontend
    runs-on: self-hosted # Must run on your server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Load environment variables
        run: |
          if [ -f .env ]; then
            set -a
            source .env
            set +a
          fi
      
      - name: Deploy using deploy script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Verify token is set (without exposing it)
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is not set!"
            echo "Please add it to GitHub Secrets: Settings → Secrets → Actions"
            exit 1
          fi
          echo "✓ Cloudflare API token is set"
          
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is not set!"
            exit 1
          fi
          echo "✓ Cloudflare Account ID is set"
          
          # Change to project directory
          cd /root/movie_recommender/AgenticAI_Movie_Recommender
          
          # Export for deploy script
          export CLOUDFLARE_API_TOKEN
          export CLOUDFLARE_ACCOUNT_ID
          
          chmod +x deploy-all.sh
          ./deploy-all.sh
      
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend deployed to Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend deployed to https://movie.baktashans.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
