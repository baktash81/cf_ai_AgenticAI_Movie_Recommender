name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy Backend and Frontend
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Deploy Backend to Cloudflare Workers
      - name: Deploy Backend to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is not set!"
            exit 1
          fi
          echo "Deploying backend to Cloudflare Workers..."
          npm install
          export CLOUDFLARE_API_TOKEN
          export CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy --env=""
      
      # Build and Deploy Frontend
      - name: Build and Deploy Frontend
        run: |
          echo "Building frontend..."
          cd frontend
          npm install
          npm run build
          
          echo "Deploying frontend..."
          sudo rm -rf /var/www/movie.baktashans.com/*
          sudo cp -r dist/* /var/www/movie.baktashans.com/
          sudo chown -R www-data:www-data /var/www/movie.baktashans.com/
          sudo systemctl reload nginx
          echo "Frontend deployed successfully"
      
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend deployed to Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend deployed to https://movie.baktashans.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
