# Nginx configuration for movie.baktashans.com
# Movie Recommendation System
# Works with stream-based SNI routing (shared port 9443)

server {
    listen 80;
    server_name movie.baktashans.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    # Listen on same internal port as main site (stream routes here)
    listen 127.0.0.1:9443 ssl;
    listen [::1]:9443 ssl;
    server_name movie.baktashans.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/movie.baktashans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movie.baktashans.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory for React build
    root /var/www/movie.baktashans.com;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to Cloudflare Workers
    location /api/ {
        proxy_pass https://movie-recommendation-system.baktash-ansari1381.workers.dev/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host movie-recommendation-system.baktash-ansari1381.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Remove /api prefix when forwarding
        rewrite ^/api/(.*) /$1 break;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Error pages
    error_page 404 /index.html;
}
