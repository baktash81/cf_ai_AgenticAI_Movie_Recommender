# Local development Nginx configuration (no SSL)
# For testing on localhost before deploying to production

server {
    listen 80;
    server_name localhost;

    # Root directory for React build
    root /var/www/movie-recommendation;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # API proxy to Cloudflare Workers
    location /api/ {
        proxy_pass https://movie-recommendation-system.baktash-ansari1381.workers.dev/;
        proxy_http_version 1.1;
        proxy_set_header Host movie-recommendation-system.baktash-ansari1381.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Remove /api prefix when forwarding
        rewrite ^/api/(.*) /$1 break;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
}
